# 回归金标准（2026-10-19 判据升级：可用性判据版）。
# 判据三层：①首 token 锚（短 prompt 稳定锚保留）②必须生成长度下限（杜绝"eos 即测了寂寞"）
#          ③生成文本必含子串（长上下文检索/质量判据——文档 QA，有标准答案）。
# 背景：旧版 pad4983 用 max_new=1 + 首 token 相等，对无损益档（bf16 PLE）是金丝雀，
#       但对任何有损档（官方 FP8 2.3% 也如此）首 token 合法翻转 ⇒ 测不出可用性。已废弃。
# 用法：bash tests/regression/run.sh [env=val ...]；新增基线先 RECORD=1 人工核对再填表。

[[case]]
name = "smoke48"
prompt = "The capital of France is"
tokens = 5          # 日志口径（2026-10-19 实测）
max_new = 16
expect_first_token = 11751      # 短 prompt 稳定锚（有损档下仍稳）
expect_contains = "Paris"
source = " （2026-10-15 基线）；contains 判据 2026-10-19 加"

[[case]]
name = "parity4167qa"
prompt_file = "tests/regression/prompts/parity4167_qa.txt"
tokens = 4189       # 4167 文档 + 问题（2026-10-19 实测）
max_new = 48
expect_contains = "26.9"        # 文档 ：p10 ≈ 26.9 ms/token
source = "2026-10-19 可用性判据版：文档 QA（原 parity4167 金丝雀废弃）"

[[case]]
name = "needle12k"
prompt_file = "tests/regression/prompts/needle12k.txt"
tokens = 14535      # 双文档拼接 + 问题（2026-10-19 实测）
max_new = 160      # think 型模型逐行引文很吃预算：96 还在引表格（2026-10-19 实测）
expect_contains = "0.52"        # 文档一事实卡：DFlash2 接受率 0.52
source = "2026-10-19 可用性判据版：多文档拼接针尖 QA（替换不真实的 fox 填充题）"
